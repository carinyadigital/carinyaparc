version: 2
updates:
  # Single pnpm lockfile at the repo root. Groups split PRs: workspace
  # (root + packages/*) and remaining apps/web dependencies.
  - package-ecosystem: 'pnpm'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '09:00'
      timezone: 'UTC'
    target-branch: 'main'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 8
    ignore:
      # typescript-eslint does not support TS 7.0.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      shared:
        patterns:
          - 'eslint'
          - 'eslint-config-prettier'
          - 'prettier'
          - 'typescript'
      workspace:
        patterns:
          - 'turbo'
          - '@eslint/js'
          - 'eslint-plugin-only-warn'
          - 'eslint-plugin-react'
          - 'eslint-plugin-react-hooks'
          - 'eslint-plugin-turbo'
          - 'globals'
          - 'typescript-eslint'
          - '@swc/helpers'
          - 'brace-expansion'
          - 'dompurify'
          - 'esbuild'
          - 'js-yaml'
          - 'nanoid'
          - 'path-to-regexp'
          - 'postcss'
          - 'toml'
      web:
        patterns:
          - '*'
        exclude-patterns:
          - 'eslint'
          - 'eslint-config-prettier'
          - 'prettier'
          - 'typescript'
          - 'turbo'
          - '@eslint/js'
          - 'eslint-plugin-only-warn'
          - 'eslint-plugin-react'
          - 'eslint-plugin-react-hooks'
          - 'eslint-plugin-turbo'
          - 'globals'
          - 'typescript-eslint'
          - '@swc/helpers'
          - 'brace-expansion'
          - 'dompurify'
          - 'esbuild'
          - 'js-yaml'
          - 'nanoid'
          - 'path-to-regexp'
          - 'postcss'
          - 'toml'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '09:00'
      timezone: 'UTC'
    labels:
      - 'dependencies'
      - 'github-actions'
    target-branch: 'main'
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
      include: 'scope'
