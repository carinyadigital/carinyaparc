version: 2
updates:
  # Single pnpm lockfile at the repo root. Dependabot's YAML value for pnpm is
  # `npm`; it detects pnpm-lock.yaml automatically. Groups split PRs: workspace
  # (root + packages/*), site (apps/site), and shared deps that appear in both.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '09:00'
      timezone: 'UTC'
    target-branch: 'main'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 8
    ignore:
      # typescript-eslint does not support TS 7.0; site tsc still uses `baseUrl`.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # Declared in root/packages and in apps/site — bump every copy in one PR.
      shared:
        patterns:
          - 'eslint'
          - 'eslint-config-prettier'
          - 'prettier'
          - 'typescript'
          - 'webpack'
      # Root package.json and packages/* only (not a direct apps/site dependency).
      workspace:
        patterns:
          - 'turbo'
          - '@eslint/js'
          - '@next/eslint-plugin-next'
          - 'eslint-plugin-only-warn'
          - 'eslint-plugin-react'
          - 'eslint-plugin-react-hooks'
          - 'eslint-plugin-turbo'
          - 'globals'
          - 'typescript-eslint'
          - '@swc/helpers'
          - 'brace-expansion'
          - 'dompurify'
          - 'esbuild'
          - 'js-yaml'
          - 'nanoid'
          - 'path-to-regexp'
          - 'postcss'
          - 'toml'
      # Remaining apps/site dependencies.
      site:
        patterns:
          - '*'
        exclude-patterns:
          - 'eslint'
          - 'eslint-config-prettier'
          - 'prettier'
          - 'typescript'
          - 'webpack'
          - 'turbo'
          - '@eslint/js'
          - '@next/eslint-plugin-next'
          - 'eslint-plugin-only-warn'
          - 'eslint-plugin-react'
          - 'eslint-plugin-react-hooks'
          - 'eslint-plugin-turbo'
          - 'globals'
          - 'typescript-eslint'
          - '@swc/helpers'
          - 'brace-expansion'
          - 'dompurify'
          - 'esbuild'
          - 'js-yaml'
          - 'nanoid'
          - 'path-to-regexp'
          - 'postcss'
          - 'toml'
    commit-message:
      prefix: 'chore'
      include: 'scope'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '09:00'
      timezone: 'UTC'
    labels:
      - 'dependencies'
      - 'github-actions'
    target-branch: 'main'
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'ci'
      include: 'scope'
